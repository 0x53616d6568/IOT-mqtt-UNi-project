name: Wokwi simulation firmware

on:
  push:
    paths:
      - "wokwi-sim/**"
      - ".github/workflows/wokwi-sim-build.yml"
  pull_request:
    paths:
      - "wokwi-sim/**"
      - ".github/workflows/wokwi-sim-build.yml"
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wokwi-sim
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Wokwi diagram and firmware layout
        run: python -m unittest discover -s tests -v

      - name: Set up PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Compile ESP32 firmware
        run: pio run
